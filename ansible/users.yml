---
# Playbook: usuarios del lab — UID consistente en los 3 nodos + MISMA contraseña + grupos.
# El rol se deriva del grupo: usuarios en 'devs' → dev; resto → student (grupo suplementario,
# el GID propio del usuario queda intacto para los homes).
#
# ══ USOS ══
# Nuevo estudiante (crea con uid consistente + contraseña en los 3 nodos a la vez):
#   ansible-playbook -i inventory.ini users.yml -K --extra-vars '{"lab_users":[
#     {"name":"prueba1","uid":26001,"groups":"students","password":"Temporal*2026"}]}'
#
# Promover a dev (grupo suplementario — NO toca uid ni contraseña de un usuario existente):
#   ansible-playbook -i inventory.ini users.yml -K --extra-vars '{"lab_users":[
#     {"name":"alguien","groups":"students,devs"}]}'
#
# Re-sincronizar contraseña (p.ej. el estudiante la cambió con passwd en un nodo):
#   ansible-playbook -i inventory.ini users.yml -K --extra-vars '{"lab_users":[
#     {"name":"prueba1","password":"Nueva*2026"}]}'
#
# ⚠️ NO pongas "uid" en usuarios YA existentes: cambiar el uid rompe la propiedad de sus
#    archivos. Solo pasa uid al crear usuarios NUEVOS.
- name: Usuarios K3S Lab
  hosts: workstations
  become: true
  vars:
    lab_users: []   # se pasa por --extra-vars

  tasks:
    - name: ¿Existe el usuario en este nodo?
      ansible.builtin.command: id -u {{ item.name }}
      register: existe
      failed_when: false
      changed_when: false
      loop: "{{ lab_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Asegurar grupo primario (para usuarios NUEVOS con uid)
      ansible.builtin.group:
        name: "{{ item.item.name }}"
        gid: "{{ item.item.uid }}"
        state: present
      when: item.item.uid is defined and item.rc != 0
      loop: "{{ existe.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Crear usuarios NUEVOS con uid consistente
      ansible.builtin.user:
        name: "{{ item.item.name }}"
        uid: "{{ item.item.uid }}"
        group: "{{ item.item.name }}"
        groups: "{{ item.item.groups | default('students') }}"
        shell: /bin/bash
        create_home: true
        append: true
        state: present
      when: item.item.uid is defined and item.rc != 0
      loop: "{{ existe.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Actualizar grupos de usuarios EXISTENTES (sin tocar uid ni home)
      ansible.builtin.user:
        name: "{{ item.item.name }}"
        groups: "{{ item.item.groups | default('students') }}"
        append: true
        state: present
      when: item.rc == 0
      loop: "{{ existe.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Fijar la MISMA contraseña en los 3 nodos (chpasswd hashea automáticamente)
      ansible.builtin.shell: echo '{{ item.item.name }}:{{ item.item.password }}' | chpasswd
      when: item.item.password is defined
      loop: "{{ existe.results }}"
      no_log: true          # ← CRÍTICO: la contraseña nunca aparece en el log de Ansible
      changed_when: true
      loop_control:
        label: "{{ item.item.name }}"
