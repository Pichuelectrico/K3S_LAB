# Inventory de Ansible para K3S Lab.
# Ansible corre desde la A100 (ya tiene ansible instalado) o desde el portátil.
# Conexión como jreinosoc con la key del lab (~/.ssh/id_k3s_lab).

[workstations]
wslab01 ansible_host=172.21.230.21
wslab02 ansible_host=172.21.230.22
wslab03 ansible_host=172.21.230.23

[workstations:vars]
ansible_user=jreinosoc
ansible_ssh_private_key_file=~/.ssh/id_k3s_lab
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

# Nodos de producción — NO incluir en playbooks del lab sin aprobación explícita
# A100   ansible_host=172.21.230.10   (datacenter, head de servicios actuales)
# H200   ansible_host=172.28.230.10   (datacenter, producción)
# DGX    ansible_host=172.28.230.11   (producción)
# DGX2   ansible_host=172.28.230.12   (producción)
